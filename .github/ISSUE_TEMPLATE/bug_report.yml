name: Bug report
description: Report a reproducible problem in Data Mover
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets, credentials, raw provider responses, and customer data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest safe set of steps, commands, or test names.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 240926.1 or abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Python version, OS, runtime mode, database, deployment target
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Paste redacted logs, error codes, run IDs, screenshots, or failing test output.
