name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: .cache/databricks-tools
          key: databricks-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-databricks-test-tools.py') }}
      - name: Install PostgreSQL server
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Quality checks
        run: make check
        env:
          PYTEST_MONGO_NOPROC: "1"
      - name: Build Hedron production manifest
        if: matrix.python-version == '3.11'
        run: make hedron-build
