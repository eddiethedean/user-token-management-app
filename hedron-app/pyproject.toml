[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-registry-hedron"
version = "0.1.0"
description = "Hedron UI port of Access Registry (standalone; full web UI parity)"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "email-validator>=2.2,<3",
  "hedron>=0.11.0",
  "httpx2>=2.9.1,<3",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
arh = "access_registry.cli:main"

[tool.setuptools.packages.find]
include = ["access_registry*", "migrations*"]

[tool.setuptools.package-data]
access_registry = ["ui/**/*.css", "static/**/*"]
migrations = ["README.md", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hedron]
format_version = 1
explorer = "off"
