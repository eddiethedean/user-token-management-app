<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated map for finding Databricks connection values</title>
  <desc id="desc">An illustration maps workspace URL, token creation with name, lifetime and scopes, and warehouse or classic cluster connection details. It shows both accepted SQL HTTP path formats and explains that the last path segment must match the compute ID.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7fb"/><stop offset="1" stop-color="#e8eef7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26354d" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172335}
      .muted{fill:#637187}.footer{fill:#bac6d6}.accent{fill:#c13d2b}.tiny{font-size:14px}.small{font-size:16px}.body{font-size:18px}.label{font-size:15px;font-weight:700;letter-spacing:.08em}.heading{font-size:26px;font-weight:700}.title{font-size:38px;font-weight:750}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="url(#bg)"/>
  <text x="72" y="76" class="label accent">DATA MOVER · DATABRICKS SETUP</text>
  <text x="72" y="126" class="title">Find the connection details</text>
  <text x="72" y="162" class="body muted">Use these locations to fill in Connections → Credentials.</text>
  <g filter="url(#shadow)"><rect x="72" y="204" width="1296" height="190" rx="18" fill="#fff"/></g>
  <circle cx="112" cy="246" r="22" fill="#e34a35"/><text x="112" y="253" text-anchor="middle" class="body white" font-weight="700">1</text>
  <text x="151" y="254" class="heading">Workspace URL</text>
  <text x="100" y="293" class="small muted">Copy your per-workspace HTTPS origin (AWS, Azure or Google Cloud).</text>
  <rect x="100" y="316" width="1240" height="53" rx="9" fill="#f1f4f8" stroke="#dce3ec"/>
  <circle cx="124" cy="342" r="6" fill="#75839a"/><text x="144" y="349" class="body">https://&lt;your-workspace-host&gt;</text>
  <rect x="1038" y="327" width="276" height="31" rx="6" fill="#fff0ec"/><text x="1176" y="348" text-anchor="middle" class="tiny" fill="#b63928" font-weight="700">Use origin only · no page path</text>
  <g filter="url(#shadow)"><rect x="72" y="424" width="610" height="364" rx="18" fill="#fff"/></g>
  <circle cx="112" cy="466" r="22" fill="#e34a35"/><text x="112" y="473" text-anchor="middle" class="body white" font-weight="700">2</text>
  <text x="151" y="474" class="heading">Personal access token</text>
  <text x="100" y="514" class="small muted">In the workspace, open:</text>
  <rect x="100" y="536" width="554" height="40" rx="7" fill="#f5f7fa"/><text x="118" y="562" class="small">Profile menu</text><text x="624" y="562" text-anchor="end" class="small muted">⌄</text>
  <rect x="100" y="580" width="554" height="40" rx="7" fill="#f5f7fa"/><text x="118" y="606" class="small">Settings → Developer</text><text x="624" y="606" text-anchor="end" class="small muted">›</text>
  <rect x="100" y="624" width="554" height="40" rx="7" fill="#f5f7fa"/><text x="118" y="650" class="small">Access tokens → Manage</text><text x="624" y="650" text-anchor="end" class="small muted">›</text>
  <rect x="100" y="674" width="184" height="42" rx="8" fill="#e34a35"/><text x="192" y="701" text-anchor="middle" class="small white" font-weight="700">Generate new token</text>
  <text x="100" y="740" class="small" font-weight="650">Set name, lifetime and API scopes → Generate</text>
  <text x="100" y="768" class="tiny muted">Copy the token once, then store it securely. Keep it private.</text>
  <g filter="url(#shadow)"><rect x="710" y="424" width="658" height="364" rx="18" fill="#fff"/></g>
  <circle cx="750" cy="466" r="22" fill="#e34a35"/><text x="750" y="473" text-anchor="middle" class="body white" font-weight="700">3</text>
  <text x="789" y="474" class="heading">Compute connection details</text>
  <rect x="738" y="505" width="602" height="115" rx="10" fill="#f5f7fa"/>
  <text x="760" y="535" class="label accent">SQL WAREHOUSE</text>
  <text x="760" y="565" class="small">Sidebar → SQL Warehouses → select warehouse</text>
  <text x="760" y="593" class="small muted">Connection Details: Server hostname + HTTP path</text>
  <rect x="738" y="632" width="602" height="115" rx="10" fill="#f5f7fa"/>
  <text x="760" y="662" class="label accent">CLASSIC ALL-PURPOSE CLUSTER</text>
  <text x="760" y="692" class="small">Compute → select cluster → Configuration</text>
  <text x="760" y="720" class="small muted">Advanced options → JDBC/ODBC: HTTP path</text>
  <text x="738" y="773" class="tiny muted">Use a supported existing compute resource, not a job cluster.</text>
  <g filter="url(#shadow)"><rect x="72" y="818" width="1296" height="250" rx="18" fill="#172335"/></g>
  <text x="104" y="859" class="label white">COPY THE HTTP PATH; MATCH THE COMPUTE ID</text>
  <text x="104" y="897" class="small white">Warehouse: /sql/1.0/warehouses/&lt;warehouse-id&gt;</text>
  <text x="104" y="927" class="small white">Classic cluster: /sql/protocolv1/o/&lt;workspace-id&gt;/&lt;cluster-id&gt;</text>
  <text x="104" y="962" class="small white">Compute ID must match the last path segment. Do not paste the full JDBC URL.</text>
  <text x="104" y="997" class="small footer">In Data Mover: choose Start manually, then Save and test changes. The test does not start compute or run SQL.</text>
  <text x="104" y="1035" class="tiny footer">Illustration · reviewed October 22, 2026 · Databricks labels may vary by cloud and release.</text>
</svg>
