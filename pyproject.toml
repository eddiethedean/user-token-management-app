[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-registry"
version = "0.1.0"
description = "Data Mover — saved pipelines with encrypted user-owned connection credentials (Hedron + HTMX UI)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
keywords = [
  "access-registry",
  "data-movement",
  "pipelines",
  "fastapi",
  "hedron",
  "htmx",
  "authentication",
  "connection-credentials",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "alembic>=1.13.1",
  "cryptography>=42.0.8",
  "email-validator>=2.2",
  "fastapi>=0.141.1",
  "hedron>=0.60.0,<0.61",
  "hedron-posit>=0.60.0,<0.61",
  "httpx2>=2.9.1",
  "pyjwt>=2.8",
  "pydantic-settings>=2.2.1",
  "pwdlib[argon2]>=0.2",
  "polars>=1.21",
  "psycopg[binary]>=3.1.18",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.29",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
  "semblance>=0.6.1",
  "testing.postgresql>=1.3.0",
  "pytest-mongo>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/user-token-management-app"
Repository = "https://github.com/eddiethedean/user-token-management-app"
Issues = "https://github.com/eddiethedean/user-token-management-app/issues"
Documentation = "https://github.com/eddiethedean/user-token-management-app#readme"
Changelog = "https://github.com/eddiethedean/user-token-management-app/blob/main/CHANGELOG.md"

[project.scripts]
access-registry = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
migrations = ["README.md", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not workbench_docker and not live_foundry'"
markers = [
  "workbench_docker: Posit Workbench Docker integration (opt-in via make workbench-test)",
  "live_foundry: opt-in live MSS/MCS-COP smoke tests (DATA_MOVER_LIVE_FOUNDRY=1)",
  "postgres: ephemeral PostgreSQL via testing.postgresql (skipped if server binaries are missing)",
  "mongodb: ephemeral MongoDB via pytest-mongo (skipped if mongod is missing)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["."]
exclude = ["**/__pycache__", "access_registry.egg-info", ".venv", "tests"]
reportMissingTypeStubs = false

# Hedron HTML kwargs remain loosely typed at call sites.
[[tool.basedpyright.executionEnvironments]]
root = "app/ui"
reportArgumentType = "none"

[tool.hedron]
format_version = 1
explorer = "off"
