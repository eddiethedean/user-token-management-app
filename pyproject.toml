[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-token-management-app"
version = "0.1.0"
description = "Administrator-approved FastAPI, Jinja, and HTMX user and token management application"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.138.2,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "playwright>=1.54,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "rsconnect-python>=1.27,<2",
  "ruff>=0.12,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.rsconnect]
app_mode = "python-fastapi"
entrypoint = "app.main:app"

[project.scripts]
utm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*"]
migrations = ["README.md", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["e2e: live Playwright browser tests through Posit Connect and Workbench profiles"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
