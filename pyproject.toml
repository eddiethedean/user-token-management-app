[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-registry"
version = "0.1.0"
description = "Access Registry — government-email user and token management (Hedron UI)"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "email-validator>=2.2,<3",
  "hedron>=0.12.0",
  "httpx2>=2.9.1,<3",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.29,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
access-registry = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
migrations = ["README.md", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["."]
exclude = ["**/__pycache__", "access_registry.egg-info", ".venv", "tests"]
reportMissingTypeStubs = false

# Hedron HTML builders intentionally use `object` / open attrs.
[[tool.basedpyright.executionEnvironments]]
root = "app/ui"
reportArgumentType = "none"
reportAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"

[tool.hedron]
format_version = 1
explorer = "off"
