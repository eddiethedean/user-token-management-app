[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access-registry"
version = "0.1.0"
description = "Access Registry — administrator-approved government-email accounts and encrypted Advana/ADE/MSS API tokens (Hedron + HTMX UI)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Odo Matthews", email = "odosmatthews@gmail.com" }]
keywords = [
  "access-registry",
  "fastapi",
  "hedron",
  "htmx",
  "authentication",
  "api-tokens",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.141.1,<0.150",
  "hedron>=0.26.1,<0.27",
  "httpx2>=2.9.1,<3",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.29,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/user-token-management-app"
Repository = "https://github.com/eddiethedean/user-token-management-app"
Issues = "https://github.com/eddiethedean/user-token-management-app/issues"
Documentation = "https://github.com/eddiethedean/user-token-management-app#readme"
Changelog = "https://github.com/eddiethedean/user-token-management-app/blob/main/CHANGELOG.md"

[project.scripts]
access-registry = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
migrations = ["README.md", "script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["."]
exclude = ["**/__pycache__", "access_registry.egg-info", ".venv", "tests"]
reportMissingTypeStubs = false

# Hedron HTML kwargs remain loosely typed at call sites.
[[tool.basedpyright.executionEnvironments]]
root = "app/ui"
reportArgumentType = "none"

[tool.hedron]
format_version = 1
explorer = "off"
