events {}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        client_max_body_size 0;

        location / {
            proxy_pass http://connect:3939;
            proxy_http_version 1.1;
            proxy_set_header X-RSC-Request $scheme://$http_host$request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Always overwrite a client-supplied value from the real Cookie header.
            proxy_set_header X-Access-Registry-Cookie $http_cookie;

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
