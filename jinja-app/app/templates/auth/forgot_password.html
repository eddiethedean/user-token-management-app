{% extends "base.html" %}
{% block auth_content %}
<section class="center-card-wrap">
  <div class="auth-card narrow-card">
    <a class="back-link" href="login">← Back to sign in</a>
    <p class="eyebrow">Account recovery</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter your verified government email. If an eligible account exists, we will send a time-limited link.</p>
    {% if success %}<div class="alert alert-success" role="status">{{ success }}</div>{% endif %}
    <form action="password/forgot" method="post" class="stack-form">
      <label for="email">Government email</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="320" required autofocus>
      <button class="button button-primary button-wide" type="submit">Send reset instructions</button>
    </form>
  </div>
</section>
{% endblock %}
