<div id="account-summary" class="account-summary"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <span class="account-avatar" aria-hidden="true">{{ (current_user.full_name or current_user.email_original)[0] | upper }}</span>
  <span class="account-copy">
    <strong>{{ current_user.full_name or current_user.email_original }}</strong>
    <small>{{ current_user.email_original }}</small>
  </span>
  <form action="logout" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="button button-quiet button-small" type="submit">Sign out</button>
  </form>
</div>
