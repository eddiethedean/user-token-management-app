<div id="password-form-region" class="form-column">
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success" role="status">{{ success }}</div>{% endif %}
  {% if not success %}
  <form action="security/password" method="post" class="stack-form" hx-post="security/password" hx-target="#password-form-region" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="15" required>
    <label for="new_password_confirm">Confirm new password</label><input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="15" required>
    <button class="button button-primary" type="submit">Change password</button>
  </form>
  {% else %}<a class="button button-primary" href="login">Return to sign in</a>{% endif %}
</div>
