<div id="profile-form-region">
  {% if success %}<div class="alert alert-success" role="status">{{ success }}</div>{% endif %}
  <form
    action="profile"
    method="post"
    class="stack-form"
    hx-post="profile"
    hx-target="#profile-form-region"
    hx-swap="outerHTML"
    hx-sync="this:drop"
    hx-disabled-elt="find button"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field-grid">
      <div class="field-full"><label for="email">Government email</label><input id="email" value="{{ current_user.email_original }}" disabled><p class="field-help">Verified addresses can only be changed through an administrator.</p></div>
      <div class="field-full"><label for="full_name">Full name</label><input id="full_name" name="full_name" value="{{ current_user.full_name }}" autocomplete="name" maxlength="160"></div>
      <div><label for="organization">Organization</label><input id="organization" name="organization" value="{{ current_user.organization }}" maxlength="160"></div>
      <div><label for="job_title">Job title</label><input id="job_title" name="job_title" value="{{ current_user.job_title }}" maxlength="160"></div>
      <div class="field-full"><label for="phone">Work phone</label><input id="phone" name="phone" value="{{ current_user.phone }}" autocomplete="tel" maxlength="40"></div>
    </div>
    <div class="form-actions"><button class="button button-primary" type="submit">Save changes</button><span class="htmx-indicator">Saving…</span></div>
  </form>
</div>
