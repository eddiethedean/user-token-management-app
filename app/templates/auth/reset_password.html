{% extends "base.html" %}
{% block auth_content %}
<section class="center-card-wrap">
  <div class="auth-card narrow-card">
    <p class="eyebrow">Account recovery</p>
    <h1>Choose a new password</h1>
    <p class="muted">Use a unique passphrase of at least 15 characters. Spaces are allowed.</p>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    {% if not error %}
    <form action="password/reset" method="post" class="stack-form">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" required autofocus><button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false">Show password</button>
      <label for="password_confirm">Confirm new password</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="15" required><button class="password-toggle" type="button" data-password-toggle="password_confirm" aria-pressed="false">Show password</button>
      <button class="button button-primary button-wide" type="submit">Reset password</button>
    </form>
    {% else %}
      <a class="button button-secondary button-wide" href="password/forgot">Request another link</a>
    {% endif %}
  </div>
</section>
{% endblock %}
